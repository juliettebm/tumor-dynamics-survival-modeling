name: Smoke test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-notebook-01:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Restore locked R environment
        uses: r-lib/actions/setup-renv@v2

      - name: Test reusable functions and documented results
        shell: Rscript {0}
        run: |
          source("tests/test-functions.R")
          source("tests/check-results.R")

      - name: Render notebook 01 and validate outputs
        shell: Rscript {0}
        run: tests/smoke-test.R
